[build]
  publish = "."
  # Os arquivos estão soltos na raiz do GitHub; este comando monta as pastas que as funções precisam.
  command = "mkdir -p netlify/functions netlify/lib && for f in feedback frete pagamento config; do cp $f.js netlify/functions/ 2>/dev/null || true; done && for f in comum dados; do cp $f.js netlify/lib/ 2>/dev/null || true; done"

[functions]
  directory = "netlify/functions"
  included_files = ["catalogo.js"]

# ---- Endereços do site (forçados: valem mesmo que existam arquivos antigos/repetidos no GitHub) ----
# Painel: https://seusite/admin
[[redirects]]
  from = "/admin"
  to = "/painel.html"
  status = 200
  force = true
[[redirects]]
  from = "/admin.html"
  to = "/painel.html"
  status = 200
  force = true

# Loja: https://seusite/
[[redirects]]
  from = "/"
  to = "/loja.html"
  status = 200
  force = true
[[redirects]]
  from = "/index.html"
  to = "/loja.html"
  status = 200
  force = true

# Bio (link do Instagram): https://seusite/bio
[[redirects]]
  from = "/bio"
  to = "/bio-glamour.html"
  status = 200
  force = true

# Sempre baixar a versão mais nova (evita ficar preso em versão antiga no navegador)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
